; Written by eos-proxy-setup.exe for {GAME_NAME} (app {APPID}).
;
; The two options below are the reason this backend is installed at all: the
; EOS proxy only gets to do its job once the game's call to
; ISteamUser::GetAuthTicketForWebApi returns something instead of an error.
; Unknown keys are ignored by gbe_fork, so leaving extras here is harmless.

[main::general]
new_app_ticket=1
gc_token=1

[main::connectivity]
disable_networking=0
disable_lan_only=0
