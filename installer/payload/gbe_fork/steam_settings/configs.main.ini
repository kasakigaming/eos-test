; Written by eos-proxy-setup.exe for {GAME_NAME} (app {APPID}).
;
; The two options under [main::general] are the reason this backend is
; installed at all: the EOS proxy only gets to do its job once the game's call
; to ISteamUser::GetAuthTicketForWebApi returns something instead of an error.
; Unknown keys are ignored by gbe_fork, so leaving extras here is harmless.

[main::general]
new_app_ticket=1
gc_token=1

[main::connectivity]
; 1 = stop gbe_fork from hooking the OS networking APIs.
;
; This one is not optional here. setup.exe installs the experimental build,
; which otherwise hooks the winsock calls and drops every connection to a
; non-LAN address - including the game's connections to Epic, which is the
; entire point of the proxy. Leave this at 1 unless you only ever play on a
; local network.
disable_lan_only=1

; Steam's own networking interface stays on: lobbies and anything that starts
; a server in the background need it.
disable_networking=0
