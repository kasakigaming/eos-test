; Written by eos-proxy-setup.exe for {GAME_NAME}.
;
; uc-online2 reads this next to the game executable. Without it the AppID falls
; back to 480 (Spacewar), and the web API ticket the EOS proxy is waiting on is
; then issued for the wrong app.
;
; AppId is what uc-online2 reports to the Steam client that is running, so it
; has to be an app the signed in account owns. If Steam refuses to hand out a
; ticket, set AppId=480 - everyone owns Spacewar - and leave ogAppId alone. The
; proxy swaps the login over to a device ID token either way, so a 480 ticket
; is enough to get past the check.

[Settings]
AppId={APPID}
ogAppId={APPID}
GetStubbedLol=false
