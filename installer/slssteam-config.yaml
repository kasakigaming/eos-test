# SLSsteam config generated by eos-proxy-setup.exe
# for {GAME_NAME} (Steam AppID {APPID}) on {GAME_DIR}
#
# SLSsteam is Linux only: it is an LD_PRELOAD shim over the real Steam client,
# so there is nothing for a Windows installer to copy into the game folder.
# This file is the part that can be generated. On the Linux machine:
#
#   1. Build or download SLSsteam:  https://github.com/AceSLS/SLSsteam
#   2. Copy this file to  ~/.config/SLSsteam/config.yaml
#      (merge it into that file by hand if you already have one - it is one
#       shared config for every game, not one per game)
#   3. Launch Steam through SLSsteam as its README describes, then start the
#      game. The EOS proxy DLL still has to be installed in the game folder,
#      which is what this installer did.
#
# FakeAppIds maps the AppID the game asks about to the AppID SLSsteam answers
# with. That mapping is what makes GetAuthTicketForWebApi return a ticket
# instead of an error, which is the whole reason the EOS proxy needs it.
# Check https://github.com/AceSLS/SLSsteam/wiki/Configuration#fakeappids-map-of-positive-number--positive-number
# for the current semantics - if the entry below does not work, that page is
# the place that says what the right hand side should be.

FakeAppIds:
  {APPID}: {APPID}
